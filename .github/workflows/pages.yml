name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar site estático
        shell: bash
        run: |
          mkdir -p _site
          cp demo/abrir-no-navegador.html _site/index.html
          touch _site/.nojekyll

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v5
