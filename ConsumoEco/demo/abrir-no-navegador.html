<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConsumoEco · Prévia local</title><style>
:root{font-family:Arial,sans-serif;color:#143b2b;background:#f1f7f1}*{box-sizing:border-box}body{margin:0}h1{font-size:30px;color:#075134}h2{font-size:22px}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:9px;padding:11px 18px;font-weight:bold}.primary{background:#07543a;color:white}.secondary{background:#e4f3d7;color:#12573b}.app{display:flex;min-height:100vh}.sidebar{background:#075036;color:white;width:250px;padding:24px 16px;flex:none}.brand{font-weight:800;font-size:28px;margin-bottom:48px}.brand span{color:#99d575}.nav{width:100%;background:transparent;color:white;text-align:left;margin-bottom:12px}.nav.active{background:#d7f4b7;color:#145134}.main{padding:32px;flex:1;min-width:0}.card{background:white;border-radius:20px;box-shadow:0 5px 20px #124c2810;padding:28px;margin:20px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:22px}.field{display:grid;gap:8px;font-weight:bold}.field input,.field select{padding:13px;border:1px solid #bbcabb;border-radius:8px;width:100%;min-height:48px}.field.wide{grid-column:1/-1}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.notice{background:#e8f6fd;color:#225879;padding:14px;border-radius:9px;margin-top:20px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.metric{border-radius:16px;padding:21px;background:#e8f7fd}.metric:nth-child(2){background:#fff6dc}.metric:nth-child(3){background:#e8f8e6}.metric strong{display:block;font-size:28px;margin:8px 0;color:#13462c}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chart{width:100%;height:220px}.green{color:#0d783f}.help{color:#708174;line-height:1.6}.login{display:grid;min-height:100vh;place-items:center;padding:22px}.login-card{width:min(550px,100%);text-align:center}.login-card input{width:100%;margin:12px 0;padding:13px;border:1px solid #c2d2c6;border-radius:8px}.badge{background:#fff1c2;border-radius:25px;padding:5px 13px;font-size:12px}.foot{text-align:center;font-size:12px;color:#6a8371}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e6eee7;padding:11px;text-align:left}input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid orange;outline-offset:3px}@media(max-width:800px){.sidebar{width:100%;position:relative}.app{display:block}.nav{width:auto}.main{padding:16px}.fields,.grid3,.chart-grid{grid-template-columns:1fr}.login-card{text-align:left}}
</style></head><body><div id="root"></div><script>
const root=document.getElementById('root');let screen='login',records=[['2026-05',16,105,220,198],['2026-06',15.5,102,210,189],['2026-07',15,98,205,184.5],['2026-08',14.5,95,200,180],['2026-09',14,92,200,180],['2026-10',12.5,85,180,162]].map((r,i)=>({id:i,...Object.fromEntries(['month','water','waterCost','energy','energyCost'].map((k,j)=>[k,r[j]]))}));
const fmt=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),n=v=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2});
const pages=[['entry','＋ Registrar consumo'],['results','▥ Resultados'],['calc','▦ Calculadora'],['tips','♧ Dicas sustentáveis']];function render(){
 if(screen==='login'){root.innerHTML=`<div class="login"><div class="card login-card"><h1>⌂ ConsumoEco</h1><p>Consumo consciente no Condomínio Vila Alpina</p><h2>Bem-vindo ao ConsumoEco</h2><p class="help">Acompanhe o consumo de água e energia e identifique oportunidades de economia.</p><label>E-mail<input value="morador.exemplo@consumoeco.test" disabled></label><label>Senha<input type="password" value="demonstracao" disabled></label><p class="help">Esta é uma prévia estática, sem autenticação ou banco de dados.</p><button class="primary" onclick="go('entry')">Explorar demonstração →</button></div></div>`;return;}
 const nav=pages.map(([id,l])=>`<button class="nav ${screen===id?'active':''}" onclick="go('${id}')">${l}</button>`).join('');root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">⌂ Consumo<span>Eco</span></div>${nav}<button class="nav" onclick="go('login')">⇥ Sair</button><p class="foot">Prévia sem servidor • dados de exemplo</p></aside><main class="main"><p style="text-align:right">◉ Morador Exemplo <span class="badge">DEMONSTRAÇÃO</span></p><div id="content"></div></main></div>`;
 if(screen==='entry')entry();if(screen==='results')results();if(screen==='calc')calculator();if(screen==='tips')tips();}
function go(p){screen=p;render();window.scrollTo(0,0)}
function entry(){document.getElementById('content').innerHTML=`<h1>Registrar consumo mensal</h1><p>Informe o consumo de água e energia da sua residência.</p><div class="card"><h2>▦ Dados do consumo</h2><p class="help">Preencha os campos abaixo para registrar o consumo do mês.</p><form id="form"><div class="fields"><label class="field wide">Mês de referência *<input id="month" type="month" required value="2026-11"></label><label class="field">Consumo de água (m³) *<input id="water" type="number" min="0" step="0.01" value="12.5" required></label><label class="field">Valor da água (R$) *<input id="waterCost" type="number" min="0" step="0.01" value="85" required></label><label class="field">Consumo de energia (kWh) *<input id="energy" type="number" min="0" step="0.01" value="180" required></label><label class="field">Valor da energia (R$) *<input id="energyCost" type="number" min="0" step="0.01" value="162" required></label></div><div class="notice">ⓘ Os campos marcados com * são obrigatórios.</div><div class="actions"><button class="secondary" type="button" onclick="go('results')">← Voltar</button><button class="primary" type="submit">▣ Salvar registro</button></div></form></div>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();const r={id:Date.now()};for(let k of ['month','water','waterCost','energy','energyCost'])r[k]=document.getElementById(k).value;if(records.some(x=>x.month===r.month)){alert('Já existe registro no mês selecionado. Escolha outro período.');return}records.push(r);records.sort((a,b)=>a.month.localeCompare(b.month));go('results');alert('Registro salvo nesta prévia!');}}
function line(key,color){let d=records.slice(-6),v=d.map(x=>Number(x[key])),max=Math.max(...v,1)*1.1,min=Math.max(0,Math.min(...v)*.8),x=i=>35+i*(460/Math.max(1,d.length-1)),y=p=>165-(p-min)/(max-min)*135;return `<svg class="chart" viewBox="0 0 520 200" role="img" aria-label="Evolução do consumo ${key==='water'?'de água':'de energia'}"><line x1="30" y1="165" x2="500" y2="165" stroke="#cad8ca"/><polyline fill="none" stroke="${color}" stroke-width="4" points="${v.map((p,i)=>x(i)+','+y(p)).join(' ')}"/>${v.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p)}" r="5" fill="${color}"/><text x="${x(i)}" y="${y(p)-12}" text-anchor="middle" font-size="12">${n(p)}</text><text x="${x(i)}" y="190" text-anchor="middle" font-size="12">${d[i].month.slice(5)}</text>`).join('')}</svg>`}
function results(){let cur=records.at(-1),prev=records.at(-2),delta=(a,b)=>b?((a-b)/b*100).toFixed(1)+'%':'—';document.getElementById('content').innerHTML=`<h1>Resultados do consumo</h1><p>Acompanhe a evolução, compare períodos e identifique oportunidades de economia.</p><div class="grid3"><div class="metric">💧 Água<strong>${n(cur.water)} m³</strong><span class="green">${delta(+cur.water,+prev?.water)} vs. mês anterior</span></div><div class="metric">⚡ Energia<strong>${n(cur.energy)} kWh</strong><span class="green">${delta(+cur.energy,+prev?.energy)} vs. mês anterior</span></div><div class="metric">◎ Gasto total<strong>${fmt(+cur.waterCost + +cur.energyCost)}</strong><span>Período ${cur.month}</span></div></div><div class="chart-grid"><div class="card"><h2>Consumo de água</h2>${line('water','#1995d5')}</div><div class="card"><h2>Consumo de energia</h2>${line('energy','#f19f21')}</div></div><div class="card"><h2 class="green">♧ Continue evoluindo!</h2><p>Acompanhe seu histórico e estabeleça metas realistas para reduzir desperdícios.</p><button class="secondary" onclick="go('calc')">Abrir calculadora de economia</button></div><div class="card"><h2>Histórico</h2><table><thead><tr><th>Mês</th><th>Água (m³)</th><th>Energia (kWh)</th><th>Despesa</th></tr></thead><tbody>${[...records].reverse().map(r=>`<tr><td>${r.month}</td><td>${n(r.water)}</td><td>${n(r.energy)}</td><td>${fmt(+r.waterCost + +r.energyCost)}</td></tr>`).join('')}</tbody></table></div><button class="primary" onclick="go('entry')">＋ Novo registro</button>`}
function calculator(){document.getElementById('content').innerHTML=`<h1>Calculadora de economia</h1><p>Simule o resultado de uma mudança de hábito.</p><div class="card"><div class="fields"><label class="field">Consumo atual (kWh)<input id="qty" type="number" value="180" min="0"></label><label class="field">Valor da despesa (R$)<input id="cost" type="number" value="162" min="0"></label><label class="field">Redução desejada (%)<input id="pct" type="number" value="10" min="0" max="100"></label></div><button style="margin-top:20px" class="primary" onclick="calc()">Calcular economia</button><div id="calcResult" class="notice">Estimativa pendente.</div><p class="help">Resultado proporcional e aproximado. Tarifas e impostos podem alterar o valor real.</p></div>`}function calc(){let q=+document.getElementById('qty').value,c=+document.getElementById('cost').value,p=+document.getElementById('pct').value;if([q,c,p].some(x=>!Number.isFinite(x)||x<0)||p>100){alert('Informe valores válidos');return}document.getElementById('calcResult').textContent=`Economia estimada: ${n(q*p/100)} kWh e ${fmt(c*p/100)} por mês.`}
function tips(){document.getElementById('content').innerHTML=`<h1>Dicas sustentáveis</h1><div class="grid3"><div class="card"><h2>💧 Água</h2><p>Reduza o tempo de banho e verifique vazamentos.</p></div><div class="card"><h2>⚡ Energia</h2><p>Utilize lâmpadas LED e aproveite a luz natural.</p></div><div class="card"><h2>♻ Reciclagem</h2><p>Separe resíduos de acordo com a coleta disponível.</p></div></div>`}render();
</script></body></html>
