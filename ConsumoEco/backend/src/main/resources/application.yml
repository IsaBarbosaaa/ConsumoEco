server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  application:
    name: consumoeco-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/consumoeco}
    username: ${DATABASE_USER:consumoeco}
    password: ${DATABASE_PASSWORD:consumoeco_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: false
